<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Club Sportif</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <nav>
        <a href="{{ url_for('dashboard') }}">Accueil</a>
        <a href="{{ url_for('membres') }}">Membres</a>
        <a href="{{ url_for('entrainements') }}">Entraînements</a>
        <a href="{{ url_for('cotisations') }}">Cotisations</a>
        <a href="{{ url_for('competitions') }}">Compétitions</a>
    </nav>

    <div class="container">
        {% with messages = get_flashed_messages(with_categories=true) %}
          {% for category, message in messages %}
            <div class="alert {{ category }}">{{ message }}</div>
          {% endfor %}
        {% endwith %}

        {% block content %}{% endblock %}
    </div>
</body>
</html>
